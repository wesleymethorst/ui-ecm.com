server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PMTiles clients fetch small byte ranges from the offline map package.
    # Nginx handles static range requests natively; keep compression disabled
    # so Content-Range always refers to the bytes in the original file.
    location ~* \.pmtiles$ {
        gzip off;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Vite gives production assets content hashes, so they can be cached for a
    # long time without serving an outdated version after a deployment.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React owns client-side routes. Never cache the HTML entry point so a
    # device sees the newest deployed asset references immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

