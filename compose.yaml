name: ui-ecm

services:
  app:
    image: ghcr.io/wesleymethorst/ui-ecm.com:latest
    container_name: ui-ecm
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
